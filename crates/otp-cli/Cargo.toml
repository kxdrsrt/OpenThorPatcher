[package]
name = "otp-cli"
description = "otp: publish and apply OpenThorPatcher patches"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "otp"
path = "src/main.rs"

[dependencies]
otp-core = { path = "../otp-core" }
clap = { version = "4", features = ["derive"] }
