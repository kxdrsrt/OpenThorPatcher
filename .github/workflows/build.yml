name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p otp-core
      - run: cargo build --release -p otp-cli -p otp-mcp -p openthor-patcher -p openthor-maker
      - uses: actions/upload-artifact@v4
        with:
          name: openthor-windows-x64
          path: |
            target/release/openthor-patcher.exe
            target/release/openthor-maker.exe
            target/release/otp.exe
            target/release/otp-mcp.exe
  linux-macos:
    strategy: { matrix: { os: [ubuntu-latest, macos-latest] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p otp-core
      - run: cargo build --release -p otp-cli -p otp-mcp
