[package]
name = "openthor-maker"
description = "OpenThor Patch Maker (Tauri 2): publish a master client as a patch site"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "openthor_maker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "openthor-maker"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
otp-core = { path = "../../../crates/otp-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.6", features = [] }
tauri-plugin-dialog = "2.8.4"
