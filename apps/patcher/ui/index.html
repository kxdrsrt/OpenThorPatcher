<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>OpenThor Patcher</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="patcher.css">
<link rel="stylesheet" id="theme-default" href="themes/default/theme.css">
<style id="theme-custom"></style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></symbol>
    <symbol id="i-update" viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.8 2.8L16 9.5"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.5v.01"/></symbol>
    <symbol id="i-error" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.5 3 8 7.5 9.5 4.5-1.5 7.5-5 7.5-9.5V6z"/><path d="m9 12 2.2 2.2L15.5 10"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-min" viewBox="0 0 24 24"><path d="M6 17h12"/></symbol>
  </defs>
</svg>

<div class="stage-wrap">
  <img id="logo" class="logo" src="themes/default/logo.png" alt="OpenThor Patcher" draggable="false" data-tauri-drag-region>
  <div class="frame">
    <header class="bar" data-tauri-drag-region>
      <div class="who" data-tauri-drag-region><span id="name">OpenThor Patcher</span><i id="sub">Checking for updates…</i></div>
      <div class="wincontrols">
        <button id="btn-settings" class="wbtn" title="Settings" aria-label="Settings"><svg class="ic"><use href="#i-gear"/></svg></button>
        <button id="btn-min" class="wbtn" title="Minimize" aria-label="Minimize"><svg class="ic"><use href="#i-min"/></svg></button>
        <button id="btn-close" class="wbtn close" title="Close" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
    </header>

    <main class="body">
      <section class="left" aria-label="News and changelog">
        <div class="tabs" role="tablist" id="tabs">
          <button role="tab" data-tab="news" class="active">News</button>
          <button role="tab" data-tab="changelog">Changelog</button>
          <button role="tab" data-tab="web" id="tab-web" hidden>Website</button>
        </div>
        <div class="box">
          <div id="p-news" class="pane active" role="tabpanel"></div>
          <div id="p-changelog" class="pane" role="tabpanel"></div>
          <div id="p-web" class="pane" role="tabpanel"><iframe id="news-frame" title="Website" referrerpolicy="no-referrer" sandbox="allow-scripts allow-popups"></iframe></div>
        </div>
      </section>

      <aside class="right" aria-label="Status">
        <div id="state" class="state"><svg class="ic"><use href="#i-update"/></svg><div><b id="state-title">Checking…</b><span id="state-text"></span></div></div>
        <div id="bar" class="progress indeterminate" role="progressbar"><i></i><em id="pct"></em></div>
        <div class="pline"><span id="p-name" class="mono"></span><span id="p-size" class="mono"></span></div>
        <pre id="log" class="out" aria-live="polite"></pre>
        <div class="buttons">
          <button id="btn-play" class="btn primary big" disabled><svg class="ic"><use href="#i-play"/></svg>Play</button>
          <button id="btn-update" class="btn big" hidden><svg class="ic"><use href="#i-update"/></svg>Update</button>
          <button id="btn-cancel" class="btn big" hidden><svg class="ic"><use href="#i-stop"/></svg>Cancel</button>
          <button id="btn-check" class="btn" title="Re-check every file against the server"><svg class="ic"><use href="#i-shield"/></svg>Check files</button>
          <button id="btn-setup" class="btn" hidden><svg class="ic"><use href="#i-sliders"/></svg>Setup</button>
        </div>
      </aside>
    </main>
    <footer class="foot"><span id="foot-ver">OpenThor Patcher</span><span id="foot-theme"></span></footer>
  </div>

  <dialog id="dlg" aria-labelledby="dlg-title">
    <form method="dialog">
      <header><h2 id="dlg-title">Settings</h2><button class="btn icon" value="close" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></header>
      <div class="card form">
        <label class="fld wide"><span>Client folder</span><span class="inline"><input id="s-dir" readonly><button id="s-pick" type="button" class="btn icon" title="Choose folder" aria-label="Choose folder"><svg class="ic"><use href="#i-open"/></svg></button></span></label>
        <label class="switch-row"><span>Update automatically on start</span><span class="switch"><input type="checkbox" id="s-auto"><i></i></span></label>
        <label class="switch-row"><span>Keep the old GRF as .bak after an update<small>off by default: the old file is replaced completely</small></span><span class="switch"><input type="checkbox" id="s-bak"><i></i></span></label>
      </div>
      <h3 id="packs-title">Options</h3>
      <div id="packs" class="card form"></div>
      <div class="row"><button class="btn primary" id="s-save" value="save">Done</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
