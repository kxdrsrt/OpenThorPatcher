<div class="stage-wrap">
  <img id="logo" class="logo" src="themes/default/logo.png" alt="OpenThor Patcher" draggable="false" data-tauri-drag-region>
  <div class="frame">
    <header class="bar" data-tauri-drag-region>
      <div class="who" data-tauri-drag-region><span id="name">OpenThor Patcher</span><i id="sub">Checking for updates…</i><div id="srv" class="srv" aria-label="Server status"></div></div>
      <div class="wincontrols">
        <button id="btn-web" class="wbtn pill" hidden title="Open the server's website"><svg class="ic"><use href="#i-globe"/></svg><span>Website</span></button>
        <button id="btn-settings" class="wbtn" title="Settings" aria-label="Settings"><svg class="ic"><use href="#i-gear"/></svg></button>
        <button id="btn-min" class="wbtn" title="Minimize" aria-label="Minimize"><svg class="ic"><use href="#i-min"/></svg></button>
        <button id="btn-close" class="wbtn close" title="Close" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
    </header>

    <main class="body">
      <section class="left" aria-label="News and changelog">
        <div class="tabs" role="tablist" id="tabs">
          <button role="tab" data-tab="news" class="active">News</button>
          <button role="tab" data-tab="changelog">Changelog</button>
          <button role="tab" data-tab="web" id="tab-web" hidden>Website</button>
        </div>
        <div class="box">
          <div id="p-news" class="pane active" role="tabpanel"></div>
          <div id="p-changelog" class="pane" role="tabpanel"></div>
          <div id="p-web" class="pane" role="tabpanel"><iframe id="news-frame" title="Website" referrerpolicy="no-referrer" sandbox="allow-scripts allow-popups"></iframe></div>
        </div>
      </section>

      <aside class="right" aria-label="Status">
        <div id="state" class="state"><svg class="ic"><use href="#i-update"/></svg><div><b id="state-title">Checking…</b><span id="state-text"></span></div></div>
        <div id="bar" class="progress indeterminate" role="progressbar"><i></i><em id="pct"></em></div>
        <div class="pline"><span id="p-name" class="mono"></span><span id="p-size" class="mono"></span></div>
        <pre id="log" class="out" aria-live="polite"></pre>
        <div class="buttons">
        <div class="row-main">
          <button id="btn-play" class="btn primary big" disabled><svg class="ic"><use href="#i-play"/></svg>Play</button>
          <button id="btn-update" class="btn big" hidden><svg class="ic"><use href="#i-update"/></svg>Update</button>
          <button id="btn-cancel" class="btn big" hidden><svg class="ic"><use href="#i-stop"/></svg>Cancel</button>
        </div>
        <div class="row-sec">
          <button id="btn-check" class="btn" title="Re-check every file against the server"><svg class="ic"><use href="#i-shield"/></svg>Check files</button>
          <button id="btn-setup" class="btn" hidden><svg class="ic"><use href="#i-sliders"/></svg>RO Setup</button>
        </div>
      </div>
      </aside>
    </main>
    <div id="scrim" class="scrim" hidden></div>
    <footer class="foot"><span id="foot-ver">OpenThor Patcher</span><span id="foot-links" class="links"></span><span id="foot-theme"></span></footer>
  </div>

  <dialog id="dlg" aria-labelledby="dlg-title">
    <form method="dialog">
      <header><h2 id="dlg-title">Settings</h2><button class="btn icon" value="close" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></header>
      <div class="card form">
        <label class="fld wide"><span>Client folder</span><span class="inline"><input id="s-dir" readonly><button id="s-pick" type="button" class="btn icon" title="Choose folder" aria-label="Choose folder"><svg class="ic"><use href="#i-open"/></svg></button></span></label>
        <label class="switch-row"><span>Update automatically on start</span><span class="switch"><input type="checkbox" id="s-auto"><i></i></span></label>
        <label class="switch-row"><span>Keep the old GRF as .bak after an update<small>off by default: the old file is replaced completely</small></span><span class="switch"><input type="checkbox" id="s-bak"><i></i></span></label>
      </div>
      <h3 id="packs-title">Options</h3>
      <div id="packs" class="card form"></div>
      <div class="row"><button class="btn primary" id="s-save" value="save">Done</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
