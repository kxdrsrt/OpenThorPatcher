# Static patch site: patchlist.json is never cached, numbered patches and files can be (their names/hashes change).
# nginx answers Range requests by itself, which is what makes player downloads resumable.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    sendfile on;
    tcp_nopush on;
    gzip off;                       # GRF/.thor data is compressed already
    autoindex off;
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;

    location = /patchlist.json     { add_header Cache-Control "no-cache" always; types { } default_type application/json; }
    location = /patchlist.json.sig { add_header Cache-Control "no-cache" always; types { } default_type text/plain; }
    location /patches/             { add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location /files/               { add_header Cache-Control "no-cache" always; }
    location = /healthz            { access_log off; return 200 "ok\n"; }
    location /state/               { return 404; }   # publisher bookkeeping, not for players
}
