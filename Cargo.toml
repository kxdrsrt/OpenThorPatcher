[workspace]
resolver = "2"
exclude = ["vendor/rgrf-core"]
members = ["crates/otp-core", "crates/otp-cli", "crates/otp-mcp", "crates/otp-testkit", "apps/maker/src-tauri", "apps/patcher/src-tauri"]

[workspace.package]
version = "0.6.2"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
